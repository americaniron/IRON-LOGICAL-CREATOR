<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Creative Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.36.0"
  }
}
</script>
<style>
  :root {
    /* Mainstream Dark Theme */
    --bg-primary: #111827;
    --bg-secondary: #1F2937;
    --bg-tertiary: #374151;
    --bg-panel: #1F2937;
    --bg-input: #111827;
    --bg-overlay: rgba(17, 24, 39, 0.95);
    
    --text-primary: #F9FAFB;
    --text-secondary: #D1D5DB;
    --text-muted: #6B7280;
    --text-inverted: #111827;
    --text-accent: #60A5FA;

    --border-primary: #374151;
    --border-secondary: #4B5563;

    --accent-primary: #3B82F6;
    --accent-secondary: #60A5FA;
    --accent-glow: 0 0 12px rgba(59, 130, 246, 0.3);

    --danger-primary: #F87171;
    --danger-secondary: #DC2626;
  }

  html.light-theme {
    /* Mainstream Light Theme */
    --bg-primary: #F3F4F6;
    --bg-secondary: #FFFFFF;
    --bg-tertiary: #F9FAFB;
    --bg-panel: #FFFFFF;
    --bg-input: #FFFFFF;
    --bg-overlay: rgba(243, 244, 246, 0.95);

    --text-primary: #1F2937;
    --text-secondary: #4B5563;
    --text-muted: #9CA3AF;
    --text-inverted: #FFFFFF;
    --text-accent: #2563EB;
    
    --border-primary: #E5E7EB;
    --border-secondary: #D1D5DB;
    
    --accent-primary: #2563EB;
    --accent-secondary: #3B82F6;
    --accent-glow: 0 0 12px rgba(37, 99, 235, 0.2);

    --danger-primary: #EF4444;
    --danger-secondary: #DC2626;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    transition: background-color 0.3s ease, color 0.3s ease;
    height: 100dvh;
    width: 100vw;
    margin: 0;
    padding: 0;
  }

  #root {
    height: 100%;
    width: 100%;
  }

  .scrollbar-thin {
    scrollbar-width: thin;
    scrollbar-color: var(--accent-primary) var(--bg-secondary);
  }
  
  .scrollbar-thin::-webkit-scrollbar { width: 8px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: var(--bg-secondary); }
  .scrollbar-thin::-webkit-scrollbar-thumb {
    background-color: var(--accent-primary);
    border-radius: 4px;
    border: 2px solid var(--bg-secondary);
  }

  @keyframes load-shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

</style>
</head>
  <body class="overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
